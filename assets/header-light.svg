<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d0d7de"/>
      <stop offset="1" stop-color="#eaeef2"/>
    </linearGradient>
    <clipPath id="bannerClip">
      <rect width="880" height="200" rx="0"/>
    </clipPath>
  </defs>

  <rect width="880" height="200" fill="url(#bg)"/>

  <!-- thin guide lines -->
  <g stroke="#d0d7de" stroke-width="1">
    <line x1="0" y1="24" x2="880" y2="24" opacity="0.7"/>
    <line x1="0" y1="176" x2="880" y2="176" opacity="0.7"/>
    <line x1="48" y1="0" x2="48" y2="200" opacity="0.4"/>
    <line x1="560" y1="0" x2="560" y2="200" opacity="0.4"/>
  </g>
  <g fill="#8c959f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">
    <text x="14" y="20">main</text>
    <text x="836" y="192" text-anchor="end">v1.0.0</text>
  </g>

  <!-- left text block -->
  <g font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="64" y="82" fill="#1f2328" font-size="34" font-weight="600" letter-spacing="0.5">Pedro Jaime</text>
    <text x="64" y="114" fill="#2c974b" font-size="15" font-weight="500" letter-spacing="3">FULL STACK DEVELOPER</text>
    <text x="64" y="150" fill="#59636e" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">Java · Spring Boot · TypeScript · Angular · Astro</text>
  </g>
  <line x1="64" y1="126" x2="196" y2="126" stroke="#2c974b" stroke-width="1.5" opacity="0.85"/>
  <line x1="200" y1="126" x2="212" y2="126" stroke="#0969da" stroke-width="1.5" opacity="0.7"/>

  <!-- right: client/server request animation -->
  <g clip-path="url(#bannerClip)">
    <!-- pipe -->
    <rect x="600" y="86" width="260" height="28" rx="14" fill="url(#pipeGrad)" stroke="#d0d7de" stroke-width="1"/>
    <line x1="616" y1="100" x2="844" y2="100" stroke="#0969da" stroke-width="1" opacity="0.25" stroke-dasharray="3 5"/>

    <!-- columnar ticks inside pipe -->
    <g stroke="#c7ccd1" stroke-width="1">
      <line x1="640" y1="90" x2="640" y2="110"/>
      <line x1="672" y1="90" x2="672" y2="110"/>
      <line x1="704" y1="90" x2="704" y2="110"/>
      <line x1="736" y1="90" x2="736" y2="110"/>
      <line x1="768" y1="90" x2="768" y2="110"/>
      <line x1="800" y1="90" x2="800" y2="110"/>
      <line x1="832" y1="90" x2="832" y2="110"/>
    </g>

    <!-- request packets, left to right -->
    <g>
      <rect x="0" y="94" width="12" height="12" rx="2" fill="#2c974b" opacity="0.9">
        <animate attributeName="x" values="596;866" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.12;0.85;1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="94" width="12" height="12" rx="2" fill="#0969da" opacity="0.8">
        <animate attributeName="x" values="596;866" dur="7s" begin="-2.33s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.12;0.85;1" dur="7s" begin="-2.33s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="94" width="12" height="12" rx="2" fill="#59636e" opacity="0.5">
        <animate attributeName="x" values="596;866" dur="7s" begin="-4.66s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.12;0.85;1" dur="7s" begin="-4.66s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- stage labels -->
    <g fill="#59636e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.5">
      <text x="600" y="76">client</text>
      <text x="695" y="76">api</text>
      <text x="800" y="76">database</text>
    </g>
    <g stroke="#d0d7de" stroke-width="1">
      <line x1="600" y1="80" x2="600" y2="86"/>
      <line x1="695" y1="80" x2="695" y2="86"/>
      <line x1="800" y1="80" x2="800" y2="86"/>
    </g>

    <!-- progress bar under pipe -->
    <rect x="600" y="134" width="260" height="3" rx="1.5" fill="#eaeef2"/>
    <rect x="600" y="134" width="0" height="3" rx="1.5" fill="#2c974b" opacity="0.8">
      <animate attributeName="width" values="0;260;260;0" keyTimes="0;0.8;0.92;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <g fill="#59636e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">
      <text x="600" y="156">build: main</text>
      <text x="860" y="156" text-anchor="end" fill="#2c974b">passing</text>
    </g>

    <!-- connector from text to pipe -->
    <path d="M 520 100 H 596" stroke="#d0d7de" stroke-width="1" fill="none" stroke-dasharray="4 4"/>
  </g>

  <!-- blinking cursor bottom-right -->
  <rect x="846" y="160" width="8" height="14" fill="#2c974b">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
